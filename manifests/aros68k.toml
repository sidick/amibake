# The zero-encumbrance smoke target: builds from nothing, no
# user-supplied assets required. Proposal's own stated role for AROS
# 68k ("every recipe's smoke target") — this is the exemplar for it.
base     = "aros68k"
machine  = { cpu = "68020" }
output   = ["hdf", "dir"]
# Emitted with no --assets and no user ROM: the base vendors its own
# (recipes/aros68k/rom/), which is the whole point of the zero-
# encumbrance target.
emit     = ["copperline", "amiberry"]

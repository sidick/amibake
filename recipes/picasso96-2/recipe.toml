# Picasso96 2.0 (driver/video/Picasso96.lha) — the freely-redistributable
# predecessor to the commercial P96 (see recipes/picasso96-3's header:
# same architecture, split into two recipes because AmiBake has no
# version-range dispatch from one package name to several recipes).
# ShareWare (fee requested, not required): the real archive's own
# Picasso96.readme states "No distribution restrictions as long as the
# archive is complete and none of the files within is changed" — so,
# unlike picasso96-3, this one is genuinely `[source.aminet]`-fetchable
# and CI-buildable.
#
# Derived by downloading the real archive from Aminet and inspecting it
# directly (paths, the real InstallPicasso96 Installer-language script's
# card-selection bitmask, and Picasso96.readme's stated requirements) —
# not guessed. Real contents confirm picasso96-3's long-assumed layout:
# Picasso96API.library + rtg.library/emulation.library/fastlayers.library
# direct under Libs/ and Libs/Picasso96/, one self-contained .card driver
# per board with no CPU-tier variants at all (single 68020+ generic
# build each). zz9000 doesn't exist yet in this 1999 release — that
# board is picasso96-3-only. [options.card] here only models the three
# boards actually reachable from a manifest today (uaegfx is what
# Copperline/Amiberry emulate; picasso-iv/cybervision64-3d are the real
# board names already established by picasso96-3) — the real archive
# ships a dozen more (Altais, Domino, Merlin, oMniBus, PicassoII,
# Piccolo, PiccoloSD64, Pixel64, RetinaBLT-Z3, Spectrum), left
# unmodeled since no recipe or CI path can exercise real hardware.
#
# `graffity` joins them by request: a real Zorro II board (Cirrus Logic
# GD542x, AutoConfig manufacturer 2092 product 33/34 per the real
# script's own `FindBoard 2092 33` probe), so nothing here can boot-test
# it either — the same "declared, not exercised" footing every non-uaegfx
# card is on. Its files are real and confirmed present in this archive:
# `Graffity.card` plus the `CirrusGD542X.chip` the script pairs with it.
#
# The `DEVS:Monitors/<BoardName>` entry each card needs is installed too,
# tool types and all — see the [install].tooltypes block below, and
# `src/amibake/icon.py` for the .info editing that makes it possible.

[package]
name     = "picasso96-2"
versions = ["2.0"]

[requires]
os  = ">= 3.0"       # per Picasso96.readme: Kickstart/Workbench 3.0 (V39)+
cpu = ">= 68020"

[source.aminet]
url    = "driver/video/Picasso96.lha"
sha256 = { "2.0" = "0146d4a2aaadb82ec454dde6ca4fb33a3f646ca4c0daa46e569c025f4d9728af" }

[install]
copy = [
  { from = "Picasso96Install/Libs/Picasso96API.library", to = "SYS:Libs/" },
  { from = "Picasso96Install/Libs/Picasso96/rtg.library", to = "SYS:Libs/Picasso96/" },
  { from = "Picasso96Install/Libs/Picasso96/emulation.library", to = "SYS:Libs/Picasso96/" },
  { from = "Picasso96Install/Libs/Picasso96/fastlayers.library", to = "SYS:Libs/Picasso96/" },
  { from = "Picasso96Install/Libs/Picasso96/uaegfx.card", to = "SYS:Libs/Picasso96/", when = "card = uaegfx" },
  { from = "Picasso96Install/Libs/Picasso96/PicassoIV.card", to = "SYS:Libs/Picasso96/", when = "card = picasso-iv" },
  { from = "Picasso96Install/Libs/Picasso96/CVision3D.card", to = "SYS:Libs/Picasso96/", when = "card = cybervision64-3d" },
  { from = "Picasso96Install/Libs/Picasso96/Graffity.card", to = "SYS:Libs/Picasso96/", when = "card = graffity" },

  # Chip drivers. A `.card` is only the board-specific half — the bus
  # decode, memory map and AutoConfig identity — and it loads a `.chip`
  # for the graphics chip actually fitted on it; `Graffity.card` is 1236
  # bytes precisely because CirrusGD542X.chip does the drawing. The real
  # InstallPicasso96 script pairs them explicitly, and these three lines
  # are its own mapping, verbatim:
  #   (BITAND #_boards (+ #GraffityBit #PicassoIIBit #PiccoloBit
  #                       #SpectrumBit))  (P_InstallChip "CirrusGD542X")
  #   (BITAND #_boards (+ #InfernoBit #PicassoIVBit))
  #                                       (P_InstallChip "CirrusGD5446")
  #   (BITAND #_boards #CyberVision3DBit) (P_InstallChip "S3ViRGE")
  # uaegfx needs none: it is the emulator's own RTG, not a real board.
  # (The picasso-iv/cybervision64-3d chips were missing here before
  # Graffity was added — their .card alone could never have driven
  # anything. Same bug, fixed in the same pass.)
  { from = "Picasso96Install/Libs/Picasso96/CirrusGD542X.chip", to = "SYS:Libs/Picasso96/", when = "card = graffity" },
  { from = "Picasso96Install/Libs/Picasso96/CirrusGD5446.chip", to = "SYS:Libs/Picasso96/", when = "card = picasso-iv" },
  { from = "Picasso96Install/Libs/Picasso96/S3ViRGE.chip", to = "SYS:Libs/Picasso96/", when = "card = cybervision64-3d" },

  # --- DEVS:Monitors entries (P_InstallCard's second half) ---
  # One generic monitor program, copied under each board's own name —
  # `(copylib (source "devs/monitors/Picasso96") (dest #_monitorpath)
  # (newname #_boardname) (infos))`. It is what offers the board's
  # screenmodes at boot; without it the RTG libraries are installed and
  # nothing ever creates a display mode. The copy brings the icon too
  # (`(infos)`), because the program reads its configuration back out of
  # the icon's tool types — see [install].tooltypes below.
  { from = "Picasso96Install/Devs/Monitors/Picasso96", to = "SYS:Devs/Monitors/uaegfx", when = "card = uaegfx" },
  { from = "Picasso96Install/Devs/Monitors/Picasso96.info", to = "SYS:Devs/Monitors/uaegfx.info", when = "card = uaegfx" },
  { from = "Picasso96Install/Devs/Monitors/Picasso96", to = "SYS:Devs/Monitors/PicassoIV", when = "card = picasso-iv" },
  { from = "Picasso96Install/Devs/Monitors/Picasso96.info", to = "SYS:Devs/Monitors/PicassoIV.info", when = "card = picasso-iv" },
  { from = "Picasso96Install/Devs/Monitors/Picasso96", to = "SYS:Devs/Monitors/CVision3D", when = "card = cybervision64-3d" },
  { from = "Picasso96Install/Devs/Monitors/Picasso96.info", to = "SYS:Devs/Monitors/CVision3D.info", when = "card = cybervision64-3d" },
  { from = "Picasso96Install/Devs/Monitors/Picasso96", to = "SYS:Devs/Monitors/Graffity", when = "card = graffity" },
  { from = "Picasso96Install/Devs/Monitors/Picasso96.info", to = "SYS:Devs/Monitors/Graffity.info", when = "card = graffity" },
]
assigns = [
  { name = "Picasso96", path = "SYS:Libs/Picasso96" },
]

# The other half of the real script's P_InstallCard: the icon it copies
# ships with an *empty* tool-type array (confirmed by parsing the real
# file), and the monitor program reads `BoardType` back from it to know
# which board it is driving. So copying the icon verbatim is not a
# half-measure, it is worse than shipping no icon at all — the program
# finds an icon, finds no BoardType in it, and gives up, where a missing
# icon at least makes it fall back to guessing. Hence [install].tooltypes,
# which sets them the same way `(settooltype "BoardType" #_boardname)`
# does.
#
# BoardType is the only mandatory one (Picasso96_english.guide: "BoardType:
# mandatory, selects the type of the board"). The script also sets
# SettingsFile and five optional display tweaks, all of which the guide
# gives defaults for; SettingsFile defaults to `DEVS:Picasso96Settings`
# and the rest to system behaviour, so this recipe sets only what is
# mandatory and leaves the tuning to whoever has the real monitor.
tooltypes = [
  { path = "SYS:Devs/Monitors/uaegfx.info", set = { BoardType = "uaegfx" }, when = "card = uaegfx" },
  { path = "SYS:Devs/Monitors/PicassoIV.info", set = { BoardType = "PicassoIV" }, when = "card = picasso-iv" },
  { path = "SYS:Devs/Monitors/CVision3D.info", set = { BoardType = "CVision3D" }, when = "card = cybervision64-3d" },
  { path = "SYS:Devs/Monitors/Graffity.info", set = { BoardType = "Graffity" }, when = "card = graffity" },
  { path = "SYS:Devs/Monitors/uaegfx.info", set = { FakeNativeModes = "Yes" }, when = ["card = uaegfx", "fake-native-modes = true"] },
  { path = "SYS:Devs/Monitors/PicassoIV.info", set = { FakeNativeModes = "Yes" }, when = ["card = picasso-iv", "fake-native-modes = true"] },
  { path = "SYS:Devs/Monitors/CVision3D.info", set = { FakeNativeModes = "Yes" }, when = ["card = cybervision64-3d", "fake-native-modes = true"] },
  { path = "SYS:Devs/Monitors/Graffity.info", set = { FakeNativeModes = "Yes" }, when = ["card = graffity", "fake-native-modes = true"] },
]

[options.card]
type     = "enum"
values   = ["uaegfx", "picasso-iv", "cybervision64-3d", "graffity"]
required = true

# uaegfx is UAE-family emulator-internal RTG, not a real board driver —
# needs an emulator that actually implements it.
[options.card.requires.uaegfx]
emulator = ["amiberry", "winuae"]

# `FakeNativeModes=Yes` on the monitor icon, the opt-in the guide points
# at when the machine has no other way to show a picture: "the default
# Amiga screen modes that would use the Amiga chip set are replaced by a
# 640x480 chunky mode with 31 kHz on this board [...] a minimalistic
# screen promotion functionality". Its own FAQ prescribes it verbatim
# for two real situations — a card with no video pass-through whose
# monitor goes blank at Workbench, and a monitor that can't do 15 kHz
# with no flicker fixer — where without it you cannot see the screen you
# would need in order to configure P96 at all.
#
# Off by default, which is the tool type's own default (absent = No) and
# the real installer's: it never sets this one. It is a rescue/headless
# setting, not a better way to run a configured machine — it gives one
# 640x480 mode and is explicitly not a replacement for a mode promoter.
[options.fake-native-modes]
type    = "bool"
default = false

[verify]
exists = ["SYS:Libs/Picasso96API.library"]

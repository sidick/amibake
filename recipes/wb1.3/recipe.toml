# Workbench/Kickstart 1.3 (1988) — the proposal's own "most extract-
# friendly install of all": a single 880K floppy, OFS, plain file
# copies, no Installer at all. Real 1.3-era consumers already exist in
# this ecosystem (sana2loop's KS 1.3/68000 target, TheWire13-style
# stacks) per the proposal's own text.
#
# VERIFIED against real media 2026-08-13: user supplied a TOSEC WB
# dump set; this recipe was built/checked against real
# "Workbench v1.3 rev 34.20 (GB)" and "Workbench v1.3.3 rev 34.34"
# floppy-disk-1 ADFs (both unmodified TOSEC dumps), and boot-verified
# for real under Copperline against a real Kickstart 1.3 ROM. Confirms:
# OFS, lower-case top-level dirs (c/devs/l/libs/s/fonts/prefs/system/
# utilities — AmigaDOS matching is case-insensitive so the patterns
# below work regardless), and that dos.library/exec.library/
# mathffp.library are *not* on disk at all — they're resident in
# Kickstart ROM on 1.x, unlike 2.0+ where more of the OS lives on-disk.
# [verify] below checks real on-disk libraries instead.
#
# Ships the *whole* real Workbench disk (C:, Devs:, L:, Libs:, Fonts:,
# Prefs:, System:, Utilities:, plus the root-level disk/trashcan/shell
# icons) — a deliberate choice (user, 2026-08-13: "always ship the full
# desktop, that way testing is against a more representative install
# with accurate environment... if we go minimalist, that gets a lot
# harder as we get to 3.2 and higher"), not the earlier CLI-only scope
# this recipe originally shipped with. The second "Extras1.3" disk
# (BasicDemos and other optional utilities) still isn't included, same
# reasoning as excluding AROS's Demos/Developer from bases/aros68k —
# it's a genuinely separate disk, not part of "the Workbench disk".
#
# `[options.boot]` picks what actually runs at startup:
#   - "workbench" (default): the real, unmodified on-disk
#     Startup-Sequence/StartupII/CLI-Startup (S/#?, copied verbatim) —
#     SetPatch, AddBuffers, BindDrivers, SetClock, the real SetMap/path/
#     LoadWB sequence. Every file it references (SYS:System/
#     FastMemFirst, SYS:System/SetMap, sys:utilities, sys:prefs, ...)
#     is now actually present, unlike when this recipe only shipped the
#     CLI subset. Boots to the real Workbench desktop, for
#     Workbench-based tools (icon-driven installers, Prefs editors,
#     anything that isn't a Shell program).
#   - "cli": skips LoadWB/the real Startup-Sequence entirely and uses a
#     hand-authored minimal one instead (`[install].files`, below) —
#     SetPatch/AddBuffers/BindDrivers plus the RAM-based T:/ENV:/CLIPS:
#     and AUX:/PIPE: setup real 1.3's own StartupII does, minus the
#     desktop. Boots straight to a Shell prompt, faster and more
#     predictable for scripted/automated use (no icon layout, no
#     LoadWB timing to wait out) — the mode this recipe originally
#     shipped as its only behaviour, and the one M5's own Copperline
#     boot verification used.
# Either way, [install].user-startup fragments from other packages
# still run: the builder auto-appends `EXECUTE S:User-Startup` to
# whichever Startup-Sequence is installed if it isn't already there
# (`Tree._ensure_startup_sequence_sources_user_startup`) — real 1.3
# Startup-Sequences never source it themselves (a 2.0+ convention, same
# generation as ENVARC:, which this recipe correctly never uses).
#
# Sub-revisions: "1.3" here is rev 34.20 (GB dump — unmodified, and a
# superset of the US disk's keymaps); "1.3.3" is rev 34.34 (US dump,
# unmodified, no regional variant). Other real sub-revisions (34.21,
# 1.3.2/34.28, ...) exist and can be added the same way if ever needed.

[package]
name     = "wb1.3"
versions = ["1.3.3", "1.3"]
strategy = "extract"

[base]
os-version        = "1.3"
kickstart-version = "34.5"   # the real KS 1.3 ROM revision
dos-type          = "ofs"    # 1.3 predates the international FFS extension

[options.boot]
type     = "enum"
values   = ["workbench", "cli"]
default  = "workbench"

[source.assets]
path   = "Workbench-{version}.adf"
sha256 = { "1.3" = "961193c379678f79ef604b76e0bc5ab1828af812583389473b45499764f0b962", "1.3.3" = "4cfd278ab763f90df165e971a31f4b86a5e02b7f78c7b9d376eb301121b8e233" }
# Both from real unmodified TOSEC dumps (see comment above) — legitimate
# known-good checksums, not placeholders. Still optional/partial-
# coverage/warn-not-fail per the recipe contract: a different (but
# equally valid) dump of the same disk shouldn't be rejected.

[install]
copy = [
  { from = "C/#?",         to = "SYS:C/" },
  { from = "Devs/#?",      to = "SYS:Devs/" },
  { from = "L/#?",         to = "SYS:L/" },
  { from = "Libs/#?",      to = "SYS:Libs/" },
  { from = "Fonts/#?",     to = "SYS:Fonts/" },
  { from = "Prefs/#?",     to = "SYS:Prefs/" },
  { from = "System/#?",    to = "SYS:System/" },
  { from = "Utilities/#?", to = "SYS:Utilities/" },
  # The root-level disk/trashcan/shell icons — an exact list (real
  # AmigaDOS patterns can't express "root files only", so alternation
  # names them), confirmed from the real disk's own directory listing.
  { from = "(.info|Disk.info|Empty.info|Expansion.info|Prefs.info|Shell|Shell.info|System.info|Trashcan.info|Utilities.info)", to = "SYS:" },
  # The real on-disk Startup-Sequence/StartupII/CLI-Startup — see the
  # [options.boot] comment above.
  { from = "S/#?", to = "SYS:S/", when = "boot = workbench" },
]

[[install.files]]
to = "SYS:S/Startup-Sequence"
when = "boot = cli"
content = """
C:SetPatch >NIL:
C:Addbuffers DF0: 10
C:BindDrivers
C:Makedir RAM:T
C:Assign T: RAM:T
C:Makedir RAM:ENV
C:Assign ENV: RAM:ENV
C:Makedir RAM:CLIPS
C:Assign CLIPS: RAM:CLIPS
C:Mount AUX:
C:Mount PIPE:
"""

[verify]
exists = ["SYS:Libs/diskfont.library", "SYS:Fonts/topaz.font"]

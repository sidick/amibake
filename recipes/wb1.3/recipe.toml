# Workbench/Kickstart 1.3 (1988) — the proposal's own "most extract-
# friendly install of all": a single 880K floppy, OFS, plain file
# copies, no Installer at all. Real 1.3-era consumers already exist in
# this ecosystem (sana2loop's KS 1.3/68000 target, TheWire13-style
# stacks) per the proposal's own text.
#
# VERIFIED against real media 2026-08-13: user supplied a TOSEC WB
# dump set; this recipe was built/checked against real
# "Workbench v1.3 rev 34.20 (GB)" and "Workbench v1.3.3 rev 34.34"
# floppy-disk-1 ADFs (both unmodified TOSEC dumps). Confirms: OFS,
# lower-case top-level dirs (c/devs/l/libs/s/fonts — AmigaDOS matching
# is case-insensitive so the patterns below work regardless), and that
# dos.library/exec.library/mathffp.library are *not* on disk at all —
# they're resident in Kickstart ROM on 1.x, unlike 2.0+ where more of
# the OS lives on-disk. [verify] below checks real on-disk libraries
# instead.
#
# Scoped to this floppy's C:/Devs:/L:/Libs:/S:/Fonts: content only —
# real disk 1 *also* ships Prefs/System/Utilities drawers and a Shell
# icon (the actual Workbench desktop GUI), which this recipe does not
# copy: this targets a CLI/AmigaDOS-level boot environment, not a
# pixel-faithful Workbench desktop. Known consequence: the disk's own
# real S:Startup-Sequence (also not copied, see below) calls
# `SYS:System/SetMap` and `LoadWB`, neither of which would work with
# only this subset — so packages should not assume a real 1.3
# Startup-Sequence is present. The second "Extras1.3" disk (BasicDemos
# and other optional utilities) isn't included either, same reasoning
# as excluding AROS's Demos/Developer from bases/aros68k.
#
# KNOWN GAP, not yet resolved: real 1.3 has no `IF EXISTS S:User-Startup
# / EXECUTE S:User-Startup` line in its Startup-Sequence at all (that's
# a 2.0+ convention, same generation as ENVARC: — confirmed by the real
# disk's own Startup-Sequence/StartupII content, and by user
# confirmation 2026-08-13 that ENVARC: itself is 2.0+ only, which this
# recipe correctly never uses). This means AmiBake's normal
# `[install].user-startup` layering mechanism — any other package's
# fragments merged into S:User-Startup — currently has no way to run on
# a wb1.3 base: nothing sources that file at boot. Not fixed here since
# it's a framework-level design question (synthesize a minimal
# Startup-Sequence? extend the schema with a literal-content S: file
# mechanism?), not a wb1.3-recipe-only concern — see PLAN.md's M5 notes.
#
# Sub-revisions: "1.3" here is rev 34.20 (GB dump — unmodified, and a
# superset of the US disk's keymaps); "1.3.3" is rev 34.34 (US dump,
# unmodified, no regional variant). Other real sub-revisions (34.21,
# 1.3.2/34.28, ...) exist and can be added the same way if ever needed.

[package]
name     = "wb1.3"
versions = ["1.3.3", "1.3"]
strategy = "extract"

[base]
os-version        = "1.3"
kickstart-version = "34.5"   # the real KS 1.3 ROM revision
dos-type          = "ofs"    # 1.3 predates the international FFS extension

[source.assets]
path   = "Workbench-{version}.adf"
sha256 = { "1.3" = "961193c379678f79ef604b76e0bc5ab1828af812583389473b45499764f0b962", "1.3.3" = "4cfd278ab763f90df165e971a31f4b86a5e02b7f78c7b9d376eb301121b8e233" }
# Both from real unmodified TOSEC dumps (see comment above) — legitimate
# known-good checksums, not placeholders. Still optional/partial-
# coverage/warn-not-fail per the recipe contract: a different (but
# equally valid) dump of the same disk shouldn't be rejected.

[install]
copy = [
  { from = "C/#?",     to = "SYS:C/" },
  { from = "Devs/#?",  to = "SYS:Devs/" },
  { from = "L/#?",     to = "SYS:L/" },
  { from = "Libs/#?",  to = "SYS:Libs/" },
  { from = "Fonts/#?", to = "SYS:Fonts/" },
]

[verify]
exists = ["SYS:Libs/diskfont.library", "SYS:Fonts/topaz.font"]

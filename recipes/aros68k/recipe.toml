# AROS 68k — the zero-encumbrance base: fetched from a nightly build,
# builds from nothing with no user-supplied assets, every recipe's smoke
# target. Real AmigaOS 3.x bases (M5) come from user-supplied install
# media instead; this one is what CI can build without anything from the
# user at all.
#
# Source: the m68k-amiga nightly's "boot-iso" artifact from AROS's
# SourceForge project — a zip wrapping one ISO9660+RockRidge image (the
# "AROS Live CD" filesystem tree), which extract.py's zip-wrapping-iso
# expansion handles transparently. Pinned to the 2026-09-30 nightly;
# every AROS nightly is a new, differently-checksummed build, and
# SourceForge prunes old dated directories (a pin goes 404 within
# weeks), so this pin is a moving target by nature: run
# `python tools/refresh_aros_nightly.py` to re-pin to the newest
# nightly that actually has the m68k boot-iso artifact (the newest
# *date* sometimes doesn't — the tool walks back until one does),
# then validate with the smoke build. The tool replaces the old pin
# rather than appending, since a pruned nightly is unfetchable anyway.
#
# AROS boots via "softkick": a small AmigaOS-compatible bootstrap loads
# AROS's own relocatable ROM image into RAM. Under emulation the direct
# equivalent is loading that image as the Kickstart ROM, which is what
# [base].rom-file/rom-ext-file below do — the ISO's own boot/amiga/
# aros-rom.bin + aros-ext.bin, vendored into rom/ rather than cut from
# the fetched archive, so an emulator config can still be emitted long
# after this nightly is pruned upstream (see rom/README.md). The
# softkick path proper (AROSBootstrap from a SYS: that holds its own
# ROM) is not reproduced: the Emergency-Boot real-hardware rescue floppy
# and the AROS.boot marker stay excluded as real-hardware artifacts, and
# so does the rest of boot/. Demos/ and Developer/ are excluded too —
# bulk not needed for a test-bed base (Developer/ alone is 276 MB).

[package]
name     = "aros68k"
versions = ["20260930"]
strategy = "extract"

[base]
# AROS targets the AmigaOS 3.1 API (per aros.org/wikipedia, "implements
# 82% of AmigaOS 3.1's components" as of the date this recipe was
# written) — not a complete or exact 3.1, so requires.os checks against
# this base are optimistic, not a guarantee: a package requiring 3.0+/
# 3.1 may still hit an AROS gap in the unimplemented ~18%. No better
# single version number exists to advertise, since AROS doesn't publish
# its own AmigaOS-equivalence number.
os-version = "3.1"
# AROS's bundled fonts ship names past the classic 30-char AmigaDOS
# limit (e.g. "Dustismo Roman Bold Italic.font") — needs DOS7 long
# filenames; confirmed by a real build failure against the default
# ffs-intl (DOS3) before this was added.
dos-type   = "ffs-intl-longname"
# AROS has no Kickstart version to look an assets/roms/ ROM up by — it
# *is* the ROM — so it ships its own, and emitted emulator configs need
# nothing from the user. Paths are relative to this recipe's directory.
rom-file     = "rom/aros-rom.bin"
rom-ext-file = "rom/aros-ext.bin"

[source.url]
url      = "https://sourceforge.net/projects/aros/files/nightly2/{version}/Binaries/AROS-{version}-amiga-m68k-boot-iso.zip/download"
filename = "AROS-{version}-amiga-m68k-boot-iso.zip"
sha256   = { "20260930" = "f4ba4be83670b293091f08debec4a8e34ee90ad83092e1c34a598143718d6104" }

[install]
copy = [
  { from = "C/#?",        to = "SYS:C/" },
  { from = "Classes/#?",  to = "SYS:Classes/" },
  { from = "Devs/#?",     to = "SYS:Devs/" },
  { from = "Expansion/#?", to = "SYS:Expansion/" },
  { from = "Fonts/#?",    to = "SYS:Fonts/" },
  { from = "L/#?",        to = "SYS:L/" },
  { from = "Libs/#?",     to = "SYS:Libs/" },
  { from = "Locale/#?",   to = "SYS:Locale/" },
  { from = "Prefs/#?",    to = "SYS:Prefs/" },
  { from = "Rexxc/#?",    to = "SYS:Rexxc/" },
  { from = "S/#?",        to = "SYS:S/" },
  { from = "Storage/#?",  to = "SYS:Storage/" },
  { from = "System/#?",   to = "SYS:System/" },
  { from = "Tools/#?",    to = "SYS:Tools/" },
  { from = "Utilities/#?", to = "SYS:Utilities/" },
  # WBStartup/ ships empty in this nightly — nothing to copy.
]

[verify]
# Not dos.library: AROS keeps the core libraries in its ROM, and the
# 20260930 nightly ships no SYS:Libs/dos.library at all (an earlier pin
# did — it moved upstream, and the re-pin caught it). asl.library is a
# disk-loaded library in the same directory, so the check still proves
# Libs/ was populated.
exists = ["SYS:Libs/asl.library", "SYS:C/Assign", "SYS:S/Startup-Sequence"]

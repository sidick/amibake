# AmigaOS 3.2.2 — the fourth extract base, and the first proving the
# format generalizes to a real *cumulative point-release* OS: Hyperion
# ships 3.2 as one base install (AmigaOS-3.2-full.lha) plus separate
# update packages (3.2.1, 3.2.2, ...) applied on top, not a standalone
# reinstall per point release. This recipe layers base + 3.2.1-update +
# 3.2.2-update via the new multi-file [source.assets] array — each
# archive is extracted independently and merged into its own
# <filename>/-prefixed namespace (see docs/recipe-contract.md).
#
# Real, legitimately-owned media: assets/hyperion/AmigaOS-3.2-full.lha,
# AmigaOS-3.2.1.lha, AmigaOS-3.2.2.lha. Confirmed 2026-08-13 by
# extracting all three with this project's own extract.py and reading
# the real Installer-language scripts directly (Install3.2.adf/Install/
# Install, 177KB; Update3.2.1.adf/Install/Install and Update3.2.2.adf/
# Install/Install, ~46-49KB each) — not guessed.
#
# Two real, project-wide gaps found and fixed to build this recipe at
# all (not just AmigaOS-3.2-full.lha's own ISO, though that surfaced
# the first two — see extract.py's own comments):
#   - AmigaOS-3.2-full.lha's install CD has no Rock Ridge or Joliet at
#     all and real 8-bit legacy filenames pycdlib's UTF-8-default walk
#     crashed on outright; plain ISO9660 paths also carry a real
#     ";<version>" suffix that was silently corrupting every extracted
#     filename and hiding the CD's nested per-disk .adf content.
#   - AmigaOS-3.2.1.lha's and AmigaOS-3.2.2.lha's entire real update
#     payload (everything but the bundled DiskDoctor rescue-floppy
#     content) ships Unix-compress/LZW-encoded (.Z), decompressed by
#     the Installer script's own UNCOMPRESS command at install time —
#     extract.py had no decompression step for this at all.
#
# Real default-install-path translation, read directly from each
# script (per docs/limits.md's "Real Installer-language scripting" —
# the scripts themselves aren't executed):
#
# Base (Install3.2.adf/Install/Install, non-interactive default: the
# `old_level` install-user-level stays at its default "intermediate",
# not "expert" — relevant below for the printer/keymap driver default):
#   - Workbench3.2.adf: whole disk (script excludes a "Locale"
#     subdirectory that doesn't actually exist on this disk — confirmed
#     directly — so a plain whole-disk copy is exact, not an
#     approximation)
#   - Extras3.2.adf: whole disk, including S/AutoArrangeIcons.rexx etc.
#     (S/User-startup is real but comment-only — the template every
#     fresh install ships, no functional lines — so copying it verbatim
#     is harmless even though this project's own [install].user-startup
#     mechanism would overwrite S:User-Startup entirely if a later
#     package in the same manifest declares fragments; confirmed by
#     reading the file's real content)
#   - Install3.2.adf: HDTools/HDToolBox -> Tools/, Installer -> System/
#     Installer, Libs/workbench.library + Libs/icon.library -> Libs/
#   - DiskDoctor.adf: C/DAControl, C/DiskDoctor, Devs/trackfile.device
#     (same "rescue floppy" content DiskDoctor.adf/OS3.1.4's own
#     Install3_1_4.adf never needed separately — 3.2 ships it as its
#     own dedicated disk)
#   - Locale.adf: Countries/ only (unconditionally copied by the real
#     script's own DOLOCALE procedure; Catalogs/Support are real but
#     language-specific — English needs neither, matching os3.1.4's own
#     "non-English locale catalogs excluded" precedent)
#   - Classes3.2.adf: whole disk
#   - Fonts.adf: whole disk -> Fonts/
#   - Storage3.2.adf: C/ -> C/ (real commands), LIBS/ -> LIBS/ (script
#     comment: "do copy old intuition V40" compatibility libs),
#     Classes/DataTypes/ -> Classes/DataTypes/, WBStartup/ -> WBStartup/
#     (auto-launch commodities), Monitors/ + DOSDrivers/ -> Storage/...
#     (same convention os3.1.4 already used), Printers/ -> Devs/Printers/
#     and Keymaps/ -> Devs/Keymaps/ (their real functional location, not
#     Storage/ — confirmed the script's own copy destinations differ
#     from os3.1.4's simpler Storage-only layout). Printers/Keymaps are
#     driver-selection dialogs in the real script (`askoptions`), but
#     the default preselection is genuinely "all" (`defselect -1`,
#     confirmed by reading the exact old_level-vs-defselect logic) only
#     when install-user-level isn't "expert" — matches the same default
#     non-interactive path convention used everywhere else in this
#     recipe, so copying every driver is the correct default-path
#     translation, not a scope expansion.
#   - Backdrops3.2.adf: whole disk -> Prefs/Presets/Backdrops/ (real
#     script copies this unconditionally, no ask-gate at all — unlike
#     GlowIcons below)
#
# 3.2.1/3.2.2 updates (Update3.2.1.adf and Update3.2.2.adf, each own
# Install/Install script's real COPYDISKCONTENT procedure): copied
# per-directory rather than whole-disk, one entry per real directory
# the procedure's own list names (C, Classes/*, Devs, L, Libs, Prefs,
# System, Tools/*, Utilities, plus 3.2.2's own Locale/Countries and
# WBStartup). Not a simplification for its own sake: both disks' own
# top-level "DEVS"/"LIBS" are genuinely uppercase on disk (confirmed
# directly), which collides with the base's already-established
# "Devs"/"Libs" mixed-case destinations on a real case-insensitive
# AmigaDOS volume — hdf output caught this outright ("Name already
# exists"). COPYDISKCONTENT itself passes "Devs"/"Libs" as a literal
# destination string regardless of the source disk's own casing (real
# AmigaDOS directory lookups are case-insensitive), so per-directory
# copies normalizing the destination casing reproduce its actual
# behaviour, not just work around the collision.
#
# Deliberately excluded from this base:
#   - ModulesA500_3.2.adf (and the other per-hardware-class Modules
#     disks, in both the base and each update package) — same real
#     LoadModule ROM-patch-module reasoning os3.1.4 already established:
#     only matter when running an older, unpatched ROM chip, redundant
#     when pairing with the actual matching current 3.2-line ROM image
#     this base ships (see [base].kickstart-version below).
#   - GlowIcons3.2.adf — real, but excluded by the script's own default
#     (`askbool ... (default 0)`, confirmed directly) unless the user
#     opts in; a cosmetic icon theme, not core functionality.
#   - MMULibs.adf — real, but not part of the main Workbench-install
#     path at all: the script's own top-level menu branches to it as a
#     wholly separate standalone installer ("MMU-Library installation"
#     — CPU-board-specific accelerator support), never reached by the
#     default full-install path this recipe translates.
#   - Storage3.2.adf's DefIcons/, Presets/Pointers/, Env-Archive prefs
#     files, and its own per-driver .info icons pattern — real, but
#     cosmetic Prefs-appearance defaults, not functional content.
#   - AmigaOS-3.2.2.1-Hotfix.lha and AmigaOS-3.2.3.lha — real, already-
#     owned media, a genuine follow-up gap: this recipe hard-codes
#     `versions = ["3.2.2"]` and one flat [install] list layering
#     exactly base+3.2.1+3.2.2 in order; adding a later point release
#     cleanly needs per-version [install] (not implemented — see
#     docs/limits.md).

[package]
name     = "os3.2.2"
versions = ["3.2.2"]
strategy = "extract"

[base]
os-version        = "3.2.2"
kickstart-version = "47.7"
# The real exec.library revision embedded in the archive's own
# ROM/kickCDTVa1000a500a2000a600.rom (read directly from the ROM
# binary's own version strings, not guessed) — the combined A1000/A500/
# A2000/A600/CDTV hardware-class image, same convention os3.1.4 used
# for picking one specific class's ROM. Other real classes (A1200,
# A3000, A4000(T)) burn genuinely different ROM binaries under this
# same archive's ROM/ directory despite being the same "3.2" release —
# not solved here, same named gap docs/limits.md already tracks.

[source.assets]
# Real multi-file cumulative update chain: base install, then 3.2.1,
# then 3.2.2 layered on top, in this order — see docs/recipe-
# contract.md's [source.assets] array convention.
path = [
  "hyperion/AmigaOS-3.2-full.lha",
  "hyperion/AmigaOS-3.2.1.lha",
  "hyperion/AmigaOS-3.2.2.lha",
]
sha256 = { "3.2.2" = [
  "67f531e86ed27e79f645d8fd746199ec5b28bc40a4f197e9197c4eb1a2dd8479",
  "7913e148373c83f1117e4077b840d4ae69bdc04ca78e2692c937458c2a4367c8",
  "2dc19a27190e49f51bbf66bd67310e722474161978c151541386ba2b397df281",
] }

[install]
copy = [
  # --- base (AmigaOS-3.2-full.lha) ---
  { from = "AmigaOS-3.2-full.lha/Workbench3.2.adf/#?",             to = "SYS:" },
  { from = "AmigaOS-3.2-full.lha/Extras3.2.adf/#?",                to = "SYS:" },
  { from = "AmigaOS-3.2-full.lha/Install3.2.adf/HDTools/#?",       to = "SYS:Tools/" },
  { from = "AmigaOS-3.2-full.lha/Install3.2.adf/Installer",        to = "SYS:System/Installer" },
  { from = "AmigaOS-3.2-full.lha/Install3.2.adf/Libs/workbench.library", to = "SYS:Libs/workbench.library" },
  { from = "AmigaOS-3.2-full.lha/Install3.2.adf/Libs/icon.library",      to = "SYS:Libs/icon.library" },
  { from = "AmigaOS-3.2-full.lha/DiskDoctor.adf/C/DAControl",       to = "SYS:C/DAControl" },
  { from = "AmigaOS-3.2-full.lha/DiskDoctor.adf/C/DiskDoctor",      to = "SYS:C/DiskDoctor" },
  { from = "AmigaOS-3.2-full.lha/DiskDoctor.adf/Devs/trackfile.device", to = "SYS:Devs/trackfile.device" },
  { from = "AmigaOS-3.2-full.lha/Locale.adf/Countries/#?",          to = "SYS:Locale/Countries/" },
  { from = "AmigaOS-3.2-full.lha/Classes3.2.adf/#?",                to = "SYS:" },
  { from = "AmigaOS-3.2-full.lha/Fonts.adf/#?",                     to = "SYS:Fonts/" },
  { from = "AmigaOS-3.2-full.lha/Storage3.2.adf/C/#?",              to = "SYS:C/" },
  { from = "AmigaOS-3.2-full.lha/Storage3.2.adf/LIBS/#?",           to = "SYS:Libs/" },
  { from = "AmigaOS-3.2-full.lha/Storage3.2.adf/Classes/DataTypes/#?", to = "SYS:Classes/DataTypes/" },
  { from = "AmigaOS-3.2-full.lha/Storage3.2.adf/WBStartup/#?",      to = "SYS:WBStartup/" },
  { from = "AmigaOS-3.2-full.lha/Storage3.2.adf/Monitors/#?",       to = "SYS:Storage/Monitors/" },
  { from = "AmigaOS-3.2-full.lha/Storage3.2.adf/DOSDrivers/#?",     to = "SYS:Storage/DOSDrivers/" },
  { from = "AmigaOS-3.2-full.lha/Storage3.2.adf/Printers/#?",       to = "SYS:Devs/Printers/" },
  { from = "AmigaOS-3.2-full.lha/Storage3.2.adf/Keymaps/#?",        to = "SYS:Devs/Keymaps/" },
  { from = "AmigaOS-3.2-full.lha/Backdrops3.2.adf/#?",              to = "SYS:Prefs/Presets/Backdrops/" },

  # --- 3.2.1 update (AmigaOS-3.2.1.lha) --- per-directory rather than
  # a whole-disk copy: the real disk's own top-level "DEVS"/"LIBS" are
  # uppercase (confirmed directly), which collides with base's
  # already-established "Devs"/"Libs" casing on a real case-insensitive
  # AmigaDOS volume (hdf output caught this: "Name already exists").
  # The update's own COPYDISKCONTENT procedure passes "Devs"/"Libs" as
  # its literal destination string regardless of the source disk's
  # casing (AmigaDOS lookups are case-insensitive), so normalizing here
  # matches its real behaviour, not just working around the collision.
  { from = "AmigaOS-3.2.1.lha/Update3.2.1.adf/C/#?",      to = "SYS:C/" },
  { from = "AmigaOS-3.2.1.lha/Update3.2.1.adf/DEVS/#?",   to = "SYS:Devs/" },
  { from = "AmigaOS-3.2.1.lha/Update3.2.1.adf/L/#?",      to = "SYS:L/" },
  { from = "AmigaOS-3.2.1.lha/Update3.2.1.adf/LIBS/#?",   to = "SYS:Libs/" },
  { from = "AmigaOS-3.2.1.lha/Update3.2.1.adf/Prefs/#?",  to = "SYS:Prefs/" },
  { from = "AmigaOS-3.2.1.lha/Update3.2.1.adf/System/#?", to = "SYS:System/" },
  { from = "AmigaOS-3.2.1.lha/Update3.2.1.adf/Tools/#?",  to = "SYS:Tools/" },
  { from = "AmigaOS-3.2.1.lha/Update3.2.1.adf/Utilities/#?", to = "SYS:Utilities/" },

  # --- 3.2.2 update (AmigaOS-3.2.2.lha) --- same per-directory,
  # normalized-casing convention as 3.2.1 above.
  { from = "AmigaOS-3.2.2.lha/Update3.2.2.adf/C/#?",      to = "SYS:C/" },
  { from = "AmigaOS-3.2.2.lha/Update3.2.2.adf/DEVS/#?",   to = "SYS:Devs/" },
  { from = "AmigaOS-3.2.2.lha/Update3.2.2.adf/L/#?",      to = "SYS:L/" },
  { from = "AmigaOS-3.2.2.lha/Update3.2.2.adf/LIBS/#?",   to = "SYS:Libs/" },
  { from = "AmigaOS-3.2.2.lha/Update3.2.2.adf/Prefs/#?",  to = "SYS:Prefs/" },
  { from = "AmigaOS-3.2.2.lha/Update3.2.2.adf/System/#?", to = "SYS:System/" },
  { from = "AmigaOS-3.2.2.lha/Update3.2.2.adf/Tools/#?",  to = "SYS:Tools/" },
  { from = "AmigaOS-3.2.2.lha/Update3.2.2.adf/Utilities/#?", to = "SYS:Utilities/" },
  { from = "AmigaOS-3.2.2.lha/Update3.2.2.adf/WBStartup/#?", to = "SYS:WBStartup/" },
  { from = "AmigaOS-3.2.2.lha/Update3.2.2.adf/Locale/Countries/#?", to = "SYS:Locale/Countries/" },
]

[verify]
exists = [
  "SYS:Libs/workbench.library",
  "SYS:Libs/icon.library",
  "SYS:Devs/Printers/Generic",
  "SYS:C/DiskDoctor",
  "SYS:Tools/Commodities/Exchange",
]

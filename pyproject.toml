[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amibake"
version = "0.1.0.dev0"
description = "Manifest-driven Amiga test setup builder"
readme = "README.md"
requires-python = ">=3.11"
# .lha extraction uses lhafile (pure Python) rather than shelling out to
# the lhasa/lha CLI — see extract.py's module docstring for why. amitools
# is used as a library for HDF/RDB/.uaem emission (emit/hdf.py,
# emit/dirtree.py) — see emit/hdf.py for a documented workaround for an
# amitools 0.8.1 bug in HDFBlockDevice. pycdlib reads (and, in tests,
# writes) ISO9660/Rock Ridge images — base-recipe install media (AROS
# nightlies now, real OS install CDs later) ship this way.
dependencies = ["lhafile>=0.3.1", "amitools>=0.8.1", "pycdlib>=1.14"]

[project.scripts]
amibake = "amibake.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/amibake"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

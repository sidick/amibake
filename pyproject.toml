[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amibake"
version = "0.1.0.dev0"
description = "Manifest-driven Amiga test setup builder"
readme = "README.md"
requires-python = ">=3.11"
# amitools arrives with M3 (HDF/ADF emission). .lha extraction uses
# lhafile (pure Python) rather than shelling out to the lhasa/lha CLI —
# see extract.py's module docstring for why.
dependencies = ["lhafile>=0.3.1"]

[project.scripts]
amibake = "amibake.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/amibake"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

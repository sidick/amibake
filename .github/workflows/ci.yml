name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Lint shipped recipes and manifests
        run: amibake lint recipes manifests
      - name: Recipe smoke build (build + [verify] against aros68k)
        run: python tools/ci_recipe_smoke.py

  docs-build:
    name: Docs site (strict build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install docs toolchain
        run: pip install -r tools/docs-requirements.txt
      - name: Strict MkDocs build
        run: mkdocs build --strict
